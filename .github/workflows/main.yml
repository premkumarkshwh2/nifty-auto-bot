name: Nifty 500 Telegram Bot

on:
  schedule:
    # Yeh har roz subah 9:00 AM IST (3:30 UTC) par bot ko automatically trigger karega
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Isse aap GitHub interface se manually bhi run kar sakte hain

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Telegram Bot
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: |
        python bot.py
