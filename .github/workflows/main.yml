name: RSI Telegram Bot Scanner

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: 
  schedule:
    - cron: '*/15 * * * *' # Har 15 minute mein automatically run hoga

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade Pip
      run: python -m pip install --upgrade pip

    - name: Install Required Libraries
      run: |
        pip install pyTelegramBotAPI yfinance pandas apscheduler requests
        pip install pandas-ta

    - name: Run Python Script
      run: |
        python auto_scanner.py
        
