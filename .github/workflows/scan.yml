name: Nifty 500 Telegram Bot Scanner

on:
  # Aap ise GitHub par manually 'Run workflow' button se bhi chala sakte hain
  workflow_dispatch:
  
  # Optional: Agar aap chahein toh schedule bhi set kar sakte hain (jaise har 30 minutes mein)
  # schedule:
  #   - cron: '*/30 4-10 * * 1-5'  # UTC time ke mutabiq Indian market hours

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository ka code checkout karein
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Python setup karein
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Zaroori libraries install karein
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance pytz requests

      # 4. Bot script run karein
      - name: Run Smart Scanner & Bot
        run: |
          python auto_scanner.py
          
