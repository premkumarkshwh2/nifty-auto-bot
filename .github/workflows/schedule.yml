name: Smart Nifty 500 RSI Alert

on:
  schedule:
    # 1. Subah 09:00 AM IST (03:30 UTC) -> Market Open Morning Scan
    - cron: '30 3 * * 1-5'
    
    # 2. Market Active Hours (09:15 AM se 03:30 PM IST / 03:45 to 10:00 UTC) -> Har 15 min mein Auto Update (1h timeframe ke liye)
    - cron: '*/15 3-10 * * 1-5'

  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Manual Test Mode (Full Report ke liye true, Breakout test ke liye false)'
        required: false
        default: 'false'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: pip install yfinance pandas numpy requests pytz

      - name: Run Smart Scanner
        env:
          FORCE_FULL_SCAN: ${{ github.event.inputs.scan_type }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python auto_scanner.py
